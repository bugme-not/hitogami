[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:xray]
command=/usr/local/bin/xray run -c /etc/xray.json
user=root
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=/usr/local/openresty/bin/openresty -g 'daemon off;'
user=root
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=20
depends_on=xray

[program:sub_server]
command=python3 /app/sub_server.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=30

[program:anti_ddos]
command=python3 /app/anti_ddos.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=30

[program:log_cleaner]
command=python3 /app/log_cleaner.py
user=root
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/proc/1/fd/1
stderr_logfile=/proc/1/fd/2
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=30
