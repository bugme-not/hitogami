worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Performance & I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;
    keepalive_requests 1000000;
    reset_timedout_connection on;

    # Disable Logging Overhead for Max Speed
    access_log off;
    error_log /dev/null crit;

    client_max_body_size 0;
    server_tokens off;

    resolver 1.1.1.1 223.5.5.5 8.8.8.8 valid=86400s;
    resolver_timeout 1s;

    # Global Low-Latency Proxy Settings
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_buffer_size 16k;
    proxy_set_header Host $host;

    # Global gRPC Settings
    grpc_read_timeout 3600s;
    grpc_send_timeout 3600s;
    grpc_socket_keepalive on;
    grpc_buffer_size 32k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Pools for Back-end Socket Reuse (Lowest Latency)
    upstream ws_tr { server [::1]:10001; keepalive 1024; }
    upstream ws_vl { server [::1]:10002; keepalive 1024; }
    upstream ws_ss { server [::1]:10003; keepalive 1024; }
    upstream ws_vm { server [::1]:10004; keepalive 1024; }

    upstream hu_tr { server [::1]:11001; keepalive 1024; }
    upstream hu_vl { server [::1]:11002; keepalive 1024; }
    upstream hu_ss { server [::1]:11003; keepalive 1024; }
    upstream hu_vm { server [::1]:11004; keepalive 1024; }

    upstream xh_tr { server [::1]:10010; keepalive 512; }
    upstream xh_vl { server [::1]:10009; keepalive 512; }
    upstream xh_ss { server [::1]:10012; keepalive 512; }
    upstream xh_vm { server [::1]:10011; keepalive 512; }

    upstream grpc_vl { server 127.0.0.1:12003; keepalive 512; }
    upstream grpc_tr { server 127.0.0.1:12001; keepalive 512; }
    upstream grpc_ss { server 127.0.0.1:12004; keepalive 512; }
    upstream grpc_vm { server 127.0.0.1:12002; keepalive 512; }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        server_name _;
        http2 on;

        location /health {
            return 200 "OK\n";
        }

        # Subscription Server
        location ^~ /sub {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Fallback / Camouflage Proxy
        location / {
            proxy_ssl_server_name on;
            proxy_ssl_name ubiquitous-fishstick.d4em0n35.workers.dev;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_pass https://ubiquitous-fishstick.d4em0n35.workers.dev;
            
            proxy_set_header Host ubiquitous-fishstick.d4em0n35.workers.dev;
            proxy_set_header Referer https://www.google.com/;
            proxy_set_header Origin https://www.cloudflare.com/;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Endpoints
        location ^~ /CxlvinTRWS {
            proxy_pass http://ws_tr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /CxlvinVlWS {
            proxy_pass http://ws_vl;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /CxlvinSSWS {
            proxy_pass http://ws_ss;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /CxlvinVMWS {
            proxy_pass http://ws_vm;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # HTTP/Upgrade Endpoints
        location ^~ /CxlvinTRHU {
            proxy_pass http://hu_tr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /CxlvinVlHU {
            proxy_pass http://hu_vl;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /CxlvinSSHU {
            proxy_pass http://hu_ss;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ^~ /CxlvinVMHU {
            proxy_pass http://hu_vm;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Direct HTTP Endpoints
        location ^~ /CxlvinTRXH { proxy_pass http://xh_tr; }
        location ^~ /CxlvinVlXH { proxy_pass http://xh_vl; }
        location ^~ /CxlvinSSXH { proxy_pass http://xh_ss; }
        location ^~ /CxlvinVMXH { proxy_pass http://xh_vm; }

        # gRPC Endpoints
        location ^~ /cxlvinvl-grpc { grpc_pass grpc://grpc_vl; }
        location ^~ /cxlvintr-grpc { grpc_pass grpc://grpc_tr; }
        location ^~ /cxlvinss-grpc { grpc_pass grpc://grpc_ss; }
        location ^~ /cxlvinvm-grpc { grpc_pass grpc://grpc_vm; }
    }
}
